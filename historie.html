<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historie Zápasů</title>
    <link rel="icon" href="https://i.imgur.com/W8ufoBX.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Code+Pro:wght@400;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Source Code Pro', monospace; background: #0d0d0d; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 2rem 1rem; }
        #history_container { width: 100%; max-width: 820px; }
        h1 { font-family: 'Oswald', sans-serif; font-size: 2.2rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #fff; text-align: center; margin-bottom: 1.8rem; position: relative; }
        h1::after { content: ''; display: block; width: 60px; height: 3px; background: #e8c840; margin: 0.5rem auto 0; }
        textarea { width: 100%; height: 260px; padding: 14px; border-radius: 4px; border: 1px solid #2a2a2a; background: #161616; color: #c8c8c8; font-family: 'Source Code Pro', monospace; font-size: 0.82rem; resize: vertical; outline: none; transition: border-color 0.2s; }
        textarea:focus { border-color: #e8c840; }
        .button-container { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 1rem 0; }
        button { padding: 10px 24px; font-family: 'Oswald', sans-serif; font-size: 0.9rem; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border: none; border-radius: 3px; transition: background 0.2s, transform 0.1s; }
        button:active { transform: scale(0.97); }
        #btn-paste { background: #1e3a2a; color: #4caf50; border: 1px solid #2d5a3d; }
        #btn-paste:hover { background: #254a33; color: #5dbf63; }
        #btn-show { background: #e8c840; color: #0d0d0d; }
        #btn-show:hover { background: #f5d750; }
        #btn-copy { background: #2a2a2a; color: #e0e0e0; border: 1px solid #3a3a3a; }
        #btn-copy:hover { background: #333; }
        #btn-clear { background: #1e1e1e; color: #888; border: 1px solid #2a2a2a; }
        #btn-clear:hover { background: #252525; color: #aaa; }
        #output { margin-top: 1.5rem; }
        .summary { font-family: 'Oswald', sans-serif; font-size: 1rem; letter-spacing: 0.06em; color: #888; text-transform: uppercase; margin-bottom: 1.2rem; padding-bottom: 0.8rem; border-bottom: 1px solid #222; }
        .summary span { color: #e8c840; }
        .match-row { display: grid; grid-template-columns: 90px 1fr auto auto 80px; align-items: center; gap: 0.8rem; padding: 10px 14px; border-radius: 3px; margin-bottom: 4px; background: #161616; border-left: 3px solid transparent; transition: background 0.15s; font-size: 0.82rem; }
        .match-row:hover { background: #1c1c1c; }
        .match-row.win  { border-left-color: #4caf50; }
        .match-row.loss { border-left-color: #f44336; }
        .match-row.draw { border-left-color: #888; }
        .match-date { color: #555; font-size: 0.75rem; white-space: nowrap; display: flex; flex-direction: column; }
        .match-date .league { color: #444; font-size: 0.65rem; letter-spacing: 0.05em; text-transform: uppercase; }
        .match-teams { color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .match-score { font-weight: 600; color: #fff; white-space: nowrap; text-align: center; }
        .match-badge { font-family: 'Oswald', sans-serif; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; padding: 3px 8px; border-radius: 2px; text-align: center; width: 56px; }
        .badge-W { background: #1a3a1a; color: #4caf50; }
        .badge-L { background: #3a1a1a; color: #f44336; }
        .badge-D { background: #2a2a2a; color: #888; }
        .match-result-text { color: #666; font-size: 0.78rem; text-align: right; }
        .error-msg { color: #f44336; font-size: 0.82rem; padding: 10px; text-align: center; }
        @media (max-width: 560px) { .match-row { grid-template-columns: 70px 1fr auto auto; } .match-result-text { display: none; } }
    </style>
</head>
<body>
    <div id="history_container">
        <h1>Historie Zápasů</h1>
        <textarea id="input" placeholder="Vložte historii zápasů sem..."></textarea>
        <div class="button-container">
            <button id="btn-paste" onclick="pasteFromClipboard()">📋 Vložit ze schránky</button>
            <button id="btn-show" onclick="processMatches()">Zobrazit historii</button>
            <button id="btn-copy" onclick="copyToClipboard()">Kopírovat</button>
            <button id="btn-clear" onclick="clearOutput()">Odstranit</button>
        </div>
        <div id="output"></div>
    </div>

    <script>
        let lastOutputText = '';

        async function pasteFromClipboard() {
            const ta = document.getElementById('input');
            try {
                const permission = await navigator.permissions.query({ name: 'clipboard-read' });
                if (permission.state === 'denied') {
                    showPasteHint();
                    return;
                }
                const text = await navigator.clipboard.readText();
                if (text) {
                    ta.value = text;
                    ta.focus();
                }
            } catch (err) {
                showPasteHint();
            }
        }

        function showPasteHint() {
            const ta = document.getElementById('input');
            ta.focus();
            const btn = document.getElementById('btn-paste');
            const orig = btn.textContent;
            btn.textContent = '⚠ Povol přístup ke schránce v prohlížeči';
            btn.style.cssText = 'background:#3a2a0a;color:#e8c840;border:1px solid #5a4a1a;';
            setTimeout(() => {
                btn.textContent = orig;
                btn.style.cssText = '';
            }, 3000);
        }

        // A "date line" now only needs to START with DD.MM.RR - the rest
        // (e.g. "LL", "CF", "MPBL", "USO", "KBO"...) is a league code stuck to it.
        function isDateLine(s) { return /^\d{2}\.\d{2}\.\d{2}/.test(s.trim()); }
        function isResultLine(s) { return /^[WLDwld]$/.test(s.trim()); }

        function splitBlocks(lines) {
            const blocks = [];
            let current = null;
            for (const line of lines) {
                if (isDateLine(line)) {
                    if (current) blocks.push(current);
                    current = [line];
                } else if (current) {
                    current.push(line);
                }
            }
            if (current) blocks.push(current);
            return blocks;
        }

        // Team names come in two shapes:
        //  - doubled: "Real MadridReal Madrid" -> the whole string is the name repeated twice
        //  - country-code prefixed (tennis): "ukSamuel T." -> 2-letter code + name, no repeat
        function dedupeName(s) {
            const n = s.length;
            if (n % 2 === 0) {
                const half = n / 2;
                if (s.slice(0, half) === s.slice(half)) return s.slice(0, half);
            }
            return s;
        }

        function stripCountryCode(s) {
            const m = s.match(/^[a-z]{2}([A-Z].*)$/);
            return m ? m[1] : s;
        }

        function cleanTeamName(raw) {
            return stripCountryCode(dedupeName(raw.trim()));
        }

        // Scores arrive glued together with no separator: "7772", "111", "610"...
        // Since we know W/L/D for the main team, we can try candidate splits
        // (starting from the most balanced one) and keep the first that is
        // consistent with the actual result.
        function splitCombinedScore(raw, mainIsTeam1, result) {
            raw = raw.trim();

            let m = raw.match(/^(\d+)\s*[-:x]\s*(\d+)$/i);
            if (m) return { s1: parseInt(m[1], 10), s2: parseInt(m[2], 10) };

            if (!/^\d+$/.test(raw)) {
                const nums = raw.match(/\d+/g);
                if (nums && nums.length >= 2) return { s1: parseInt(nums[0], 10), s2: parseInt(nums[1], 10) };
                return null;
            }

            const n = raw.length;
            if (n < 2) return null;

            const mid = n / 2;
            const points = [];
            for (let p = 1; p < n; p++) points.push(p);
            points.sort((a, b) => (Math.abs(a - mid) - Math.abs(b - mid)) || (a - b));

            let fallback = null;
            for (const p of points) {
                const aStr = raw.slice(0, p), bStr = raw.slice(p);
                if (aStr.length > 1 && aStr[0] === '0') continue;
                if (bStr.length > 1 && bStr[0] === '0') continue;
                const a = parseInt(aStr, 10), b = parseInt(bStr, 10);
                if (!fallback) fallback = { s1: a, s2: b };

                const mainScore = mainIsTeam1 ? a : b;
                const otherScore = mainIsTeam1 ? b : a;
                let ok = false;
                if (result === 'W') ok = mainScore > otherScore;
                else if (result === 'L') ok = mainScore < otherScore;
                else if (result === 'D') ok = mainScore === otherScore;
                if (ok) return { s1: a, s2: b };
            }
            return fallback;
        }

        // Every block is exactly 5 lines: date+league, team1, team2, score, result
        function parseBlock(block, mainTeam) {
            if (block.length !== 5) return null;

            const dateMatch = block[0].match(/^(\d{2}\.\d{2}\.\d{2})(.*)$/);
            if (!dateMatch) return null;
            const date = dateMatch[1];
            const league = dateMatch[2].trim();

            const result = block[4].trim().toUpperCase();
            if (!['W', 'L', 'D'].includes(result)) return null;

            const team1 = cleanTeamName(block[1]);
            const team2 = cleanTeamName(block[2]);

            const mt = (mainTeam || '').trim().toLowerCase();
            let mainIsTeam1 = true;
            if (mt) {
                const t1Match = team1.toLowerCase().includes(mt) || mt.includes(team1.toLowerCase());
                const t2Match = team2.toLowerCase().includes(mt) || mt.includes(team2.toLowerCase());
                mainIsTeam1 = !(t2Match && !t1Match);
            }

            const scores = splitCombinedScore(block[3], mainIsTeam1, result);
            if (!scores) return null;

            return { date, league, team1, team2, score1: scores.s1, score2: scores.s2, result };
        }

        function processMatches() {
            const raw = document.getElementById('input').value.trim();
            if (!raw) return;
            const allLines = raw.split('\n').map(l => l.trim()).filter(l => l !== '');

            let mainTeam = '';
            let startIdx = 0;
            if (allLines[0] && !isDateLine(allLines[0])) {
                mainTeam = allLines[0].replace(/^Last matches:\s*/i, '').trim();
                startIdx = 1;
            }

            const dataLines = allLines.slice(startIdx);
            const blocks = splitBlocks(dataLines);

            if (blocks.length === 0) {
                document.getElementById('output').innerHTML = '<p class="error-msg">Nebyla nalezena žádná data.</p>';
                return;
            }

            const matches = [];
            for (const block of blocks) {
                const m = parseBlock(block, mainTeam);
                if (m) matches.push(m);
            }

            if (matches.length === 0) {
                document.getElementById('output').innerHTML = '<p class="error-msg">Data se nepodařilo rozpoznat. Zkontroluj formát vstupu.</p>';
                return;
            }

            const resultLabel = { W: 'Výhra', L: 'Prohra', D: 'Remíza' };
            const rowClass   = { W: 'win',   L: 'loss',   D: 'draw' };

            let textLines = [];
            if (mainTeam) textLines.push(`Analyzovaný tým/hráč: ${mainTeam}`);
            textLines.push(`Celkový počet zápasů: ${matches.length}`);
            textLines.push('');

            let html = '';
            if (mainTeam) {
                html += `<div class="summary">Tým / Hráč: <span>${mainTeam}</span> &nbsp;·&nbsp; Zápasů: <span>${matches.length}</span></div>`;
            } else {
                html += `<div class="summary">Celkem zápasů: <span>${matches.length}</span></div>`;
            }

            for (const m of matches) {
                const scoreStr = `${m.score1} – ${m.score2}`;
                const rc = rowClass[m.result] || 'draw';
                const rl = resultLabel[m.result] || m.result;
                const badge = `<span class="match-badge badge-${m.result}">${m.result}</span>`;
                html += `<div class="match-row ${rc}">
                    <span class="match-date">${m.date}${m.league ? `<span class="league">${m.league}</span>` : ''}</span>
                    <span class="match-teams">${m.team1} vs ${m.team2}</span>
                    <span class="match-score">${scoreStr}</span>
                    ${badge}
                    <span class="match-result-text">${rl}</span>
                </div>`;
                textLines.push(`${m.team1} vs ${m.team2}: ${scoreStr} - ${rl} (${m.date}${m.league ? ' ' + m.league : ''})`);
            }

            lastOutputText = textLines.join('\n');
            document.getElementById('output').innerHTML = html;
        }

        function copyToClipboard() {
            if (!lastOutputText) return alert('Nejprve zobrazte historii.');
            navigator.clipboard.writeText(lastOutputText).catch(() => {
                const t = document.createElement('textarea');
                t.value = lastOutputText;
                document.body.appendChild(t);
                t.select();
                document.execCommand('copy');
                document.body.removeChild(t);
            });
            alert('Zkopírováno!');
        }

        function clearOutput() {
            document.getElementById('input').value = '';
            document.getElementById('output').innerHTML = '';
            lastOutputText = '';
        }
    </script>
</body>
</html>
