<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profesionální Sportovní Analytik PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: #0f1623;
    --surface2: #151d2e;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --accent3: #39d353;
    --gold: #ffd700;
    --text: #e8edf5;
    --muted: #5a7090;
    --danger: #ff4444;
    --green: #00e676;
    --font-heading: 'Bebas Neue', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.3s;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(0,212,255,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 50% 30% at 80% 80%, rgba(255,107,53,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }

  header {
    text-align: center;
    padding: 3rem 0 2rem;
    border-bottom: 1px solid var(--border);
    margin-bottom: 3rem;
  }

  .header-badge {
    display: inline-block;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    color: #000;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.15em;
    padding: 0.35rem 1.2rem;
    border-radius: 3px;
    margin-bottom: 1.5rem;
    text-transform: uppercase;
    transition: all 0.3s ease;
  }

  .title-carousel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    margin-bottom: 1rem;
    position: relative;
  }

  .carousel-btn {
    background: rgba(30, 45, 69, 0.4);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 1.5rem;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    user-select: none;
    z-index: 2;
  }

  .carousel-btn:hover {
    background: var(--surface2);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    transform: scale(1.08);
  }

  .carousel-btn:active { transform: scale(0.95); }

  .title-text-wrap {
    min-width: 320px;
    text-align: center;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .title-text-wrap.fade-out {
    opacity: 0;
    transform: translateY(-8px) scale(0.95);
  }

  h1 {
    font-family: var(--font-heading);
    font-size: clamp(2.5rem, 8vw, 5.5rem);
    letter-spacing: 0.04em;
    line-height: 0.95;
    background: linear-gradient(135deg, #fff 30%, var(--accent) 80%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }

  .sub {
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 300;
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.6;
    transition: opacity 0.2s;
  }

  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.5rem;
    margin-bottom: 2rem;
  }

  @media (max-width: 768px) { .input-grid { grid-template-columns: 1fr; } }

  .input-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.5rem;
    position: relative;
    transition: transform 0.3s;
  }

  .input-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    transition: background 0.3s;
  }

  .input-card.a::before { background: linear-gradient(90deg, var(--accent), transparent); }
  .input-card.b::before { background: linear-gradient(90deg, var(--accent2), transparent); }

  .input-label {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .team-badge-a { color: var(--accent); transition: color 0.3s; }
  .team-badge-b { color: var(--accent2); transition: color 0.3s; }

  textarea {
    width: 100%;
    height: 320px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 0.72rem;
    line-height: 1.6;
    padding: 1rem;
    resize: vertical;
    outline: none;
    transition: border-color 0.2s;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .btn-wrap {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 3rem;
    flex-wrap: wrap;
  }

  .btn-analyze {
    background: linear-gradient(135deg, var(--accent), #0080ff);
    color: #000;
    border: none;
    font-family: var(--font-heading);
    font-size: 1.6rem;
    letter-spacing: 0.1em;
    padding: 1rem 3.5rem;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 0 40px rgba(0,212,255,0.2);
  }

  .btn-analyze:hover { 
    transform: scale(1.02); 
    box-shadow: 0 0 60px rgba(0,212,255,0.4); 
    background: linear-gradient(135deg, #fff, var(--accent));
  }
  .btn-analyze:active { transform: scale(0.98); }
  .btn-analyze:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn-clear {
    background: rgba(30, 45, 69, 0.4);
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--font-heading);
    font-size: 1.6rem;
    letter-spacing: 0.1em;
    padding: 1rem 2.5rem;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-clear:hover {
    background: rgba(255, 68, 68, 0.1);
    border-color: var(--danger);
    color: var(--danger);
    box-shadow: 0 0 30px rgba(255, 68, 68, 0.15);
    transform: scale(1.02);
  }

  .btn-clear:active { transform: scale(0.98); }

  #loading {
    display: none;
    text-align: center;
    padding: 3.5rem;
  }

  .spinner {
    width: 60px; height: 60px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 2rem;
    transition: border-top-color 0.3s;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-steps { display: flex; flex-direction: column; gap: 0.6rem; align-items: center; }
  .step { font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); transition: color 0.3s; }
  .step.active { color: var(--accent); }
  .step.done { color: var(--green); }

  #results { display: none; }

  .section-title {
    font-family: var(--font-heading);
    font-size: 0.85rem;
    letter-spacing: 0.2em;
    color: var(--muted);
    text-transform: uppercase;
    margin-top: 2.5rem;
    margin-bottom: 1.5rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }

  .section-title span { color: var(--accent); }

  .verdict-card {
    background: linear-gradient(135deg, var(--surface) 0%, #0a1828 100%);
    border: 1px solid var(--accent);
    border-radius: 4px;
    padding: 2.5rem;
    margin-bottom: 2rem;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }

  .verdict-card::after {
    content: 'PREDICTION';
    position: absolute;
    right: -1.5rem;
    top: 50%;
    transform: translateY(-50%) rotate(90deg);
    font-family: var(--font-heading);
    font-size: 6rem;
    color: rgba(255,255,255,0.02);
    letter-spacing: 0.1em;
    pointer-events: none;
  }

  .vs-row {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 2rem;
    align-items: center;
    margin-bottom: 2rem;
  }

  .team-verdict { text-align: center; }
  .team-name-big {
    font-family: var(--font-heading);
    font-size: clamp(1.8rem, 4vw, 3rem);
    letter-spacing: 0.05em;
    margin-bottom: 0.25rem;
  }

  .win-prob {
    font-family: var(--font-mono);
    font-size: 2.5rem;
    font-weight: 700;
  }

  .vs-divider {
    font-family: var(--font-heading);
    font-size: 2rem;
    color: var(--muted);
  }

  .winner-badge {
    display: inline-block;
    background: var(--gold);
    color: #000;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    font-weight: 700;
    padding: 0.2rem 0.75rem;
    border-radius: 2px;
    letter-spacing: 0.1em;
    margin-top: 0.5rem;
  }

  /* ===================== SCORING PANEL STYLES ===================== */
  .scoring-panel {
    background: linear-gradient(135deg, #0a1020 0%, var(--surface) 100%);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2rem;
    margin-bottom: 2rem;
    position: relative;
    overflow: hidden;
  }

  .scoring-panel::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .scoring-header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 1.5rem;
    align-items: center;
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
  }

  .scoring-team {
    text-align: center;
  }

  .scoring-team-name {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  .scoring-score {
    font-family: var(--font-heading);
    font-size: 4rem;
    line-height: 1;
    letter-spacing: 0.05em;
  }

  .scoring-score-label {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--muted);
    margin-top: 0.2rem;
  }

  .scoring-divider {
    text-align: center;
  }

  .scoring-divider-text {
    font-family: var(--font-heading);
    font-size: 1.5rem;
    color: var(--muted);
  }

  .scoring-divider-sub {
    font-family: var(--font-mono);
    font-size: 0.55rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    margin-top: 0.3rem;
  }

  .scoring-bar-wrap {
    position: relative;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    margin: 1rem 0 1.5rem;
    overflow: hidden;
  }

  .scoring-bar-a {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    background: var(--accent);
    border-radius: 4px;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .scoring-bar-b {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    background: var(--accent2);
    border-radius: 4px;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .scoring-breakdown {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .scoring-row {
    display: grid;
    grid-template-columns: 32px 1fr 32px;
    gap: 0.75rem;
    align-items: center;
    padding: 0.45rem 0.5rem;
    border-radius: 3px;
    transition: background 0.15s;
  }

  .scoring-row:hover {
    background: rgba(255,255,255,0.03);
  }

  .scoring-row.winner-a {
    background: rgba(0, 212, 255, 0.05);
    border-left: 2px solid var(--accent);
  }

  .scoring-row.winner-b {
    background: rgba(255, 107, 53, 0.05);
    border-right: 2px solid var(--accent2);
  }

  .scoring-row.winner-tie {
    opacity: 0.5;
  }

  .scoring-row-label {
    font-size: 0.78rem;
    color: var(--text);
    text-align: center;
  }

  .scoring-dot {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    font-weight: 700;
  }

  .scoring-dot-a {
    background: rgba(0, 212, 255, 0.15);
    color: var(--accent);
    border: 1px solid rgba(0, 212, 255, 0.3);
  }

  .scoring-dot-a.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
  }

  .scoring-dot-b {
    background: rgba(255, 107, 53, 0.15);
    color: var(--accent2);
    border: 1px solid rgba(255, 107, 53, 0.3);
  }

  .scoring-dot-b.active {
    background: var(--accent2);
    color: #fff;
    border-color: var(--accent2);
    box-shadow: 0 0 10px rgba(255, 107, 53, 0.5);
  }

  .scoring-dot-tie {
    background: rgba(90,112,144,0.15);
    color: var(--muted);
    border: 1px solid rgba(90,112,144,0.3);
    font-size: 0.5rem;
  }

  /* ===================== END SCORING STYLES ===================== */

  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 1rem;
    margin-bottom: 2rem;
  }

  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.5rem;
    transition: border-color 0.3s;
  }

  .metric-card:hover { border-color: var(--accent); }

  .metric-title {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 1rem;
  }

  .metric-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.6rem;
  }

  .metric-team { font-size: 0.85rem; font-weight: 500; }

  .metric-val {
    font-family: var(--font-mono);
    font-size: 1rem;
    font-weight: 700;
  }

  .bar-wrap { height: 4px; background: var(--border); border-radius: 2px; margin-top: 0.4rem; }
  .bar { height: 100%; border-radius: 2px; transition: width 0.8s ease; }

  .bar-a { background: var(--accent); }
  .bar-b { background: var(--accent2); }

  .c-high { color: var(--green); }
  .c-mid { color: var(--gold); }
  .c-low { color: var(--danger); }

  .h2h-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  table { width: 100%; border-collapse: collapse; }
  th {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    color: var(--muted);
    text-transform: uppercase;
    padding: 0.5rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 0.6rem 0.75rem;
    font-size: 0.85rem;
    border-bottom: 1px solid rgba(30,45,69,0.5);
  }

  tr:last-child td { border-bottom: none; }

  .badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 0.6rem;
    font-weight: 700;
    padding: 0.15rem 0.5rem;
    border-radius: 2px;
  }

  .badge-win { background: rgba(0,230,118,0.15); color: var(--green); }
  .badge-loss { background: rgba(255,68,68,0.15); color: var(--danger); }
  .badge-draw { background: rgba(255,215,0,0.15); color: var(--gold); }

  .ai-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 4px;
    padding: 2rem;
    margin-bottom: 2rem;
  }

  .ai-label {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  .ai-label::before {
    content: '';
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .ai-text {
    font-size: 0.95rem;
    line-height: 1.75;
    color: var(--text);
  }

  .ai-text p { margin-bottom: 0.8rem; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
  @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } }

  .form-match {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.82rem;
  }

  .score-pill {
    font-family: var(--font-mono);
    font-size: 0.8rem;
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 0.1rem 0.5rem;
    border-radius: 2px;
  }

  .err-msg {
    background: rgba(255,68,68,0.1);
    border: 1px solid rgba(255,68,68,0.3);
    border-radius: 4px;
    padding: 1rem 1.5rem;
    color: var(--danger);
    font-size: 0.85rem;
    margin: 2rem auto 0;
    max-width: 600px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="header-badge" id="headerBadge">⚽ AI Powered · v3.8 PRO · Profesionální</div>
    <div class="title-carousel">
      <button class="carousel-btn" onclick="changeSport(-1)" title="Předchozí sport">◂</button>
      <div class="title-text-wrap" id="titleTextWrap">
        <h1 id="mainTitle">FOTBALOVÝ<br>ANALYTIK</h1>
      </div>
      <button class="carousel-btn" onclick="changeSport(1)" title="Další sport">▸</button>
    </div>
    <p class="sub" id="subTitle">Vložte surová data zápasů — AI provede kompletní synchronizovanou analýzu včetně herních detailů ze živého internetu.</p>
  </header>

  <div class="input-grid">
    <div class="input-card a">
      <div class="input-label" id="labelTeamA"><span class="team-badge-a">◆</span> TÝM A — Domácí / Host</div>
      <textarea id="teamA" placeholder=""></textarea>
    </div>
    <div class="input-card b">
      <div class="input-label" id="labelTeamB"><span class="team-badge-b">◆</span> TÝM B — Domácí / Host</div>
      <textarea id="teamB" placeholder=""></textarea>
    </div>
  </div>

  <div class="btn-wrap">
    <button class="btn-analyze" id="btnAnalyze" onclick="startAnalysis()">
      SPUSTIT KOMPLETNÍ ANALÝZU
    </button>
    <button class="btn-clear" id="btnClear" onclick="clearInputs()">
      VYMAZAT VSTUPY
    </button>
  </div>

  <div class="section-title" id="historyTitle" style="cursor: pointer; user-select: none;" onclick="toggleHistory()">
    <span>00</span> HISTORIE ANALÝZ (KLIKNĚTE PRO ZOBRAZENÍ / SKRYTÍ)
  </div>
  <div id="historyContainer" class="h2h-card" style="margin-bottom: 2rem; display: block;">
    <div id="historyList" style="display: flex; flex-direction: column; gap: 0.75rem;"></div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div style="font-family:var(--font-mono);font-size:0.9rem;color:var(--muted);letter-spacing:0.08em;" id="s1">NAČÍTÁM ANALÝZU...</div>
    <div style="display:none" id="s2"></div>
    <div style="display:none" id="s3"></div>
    <div style="display:none" id="s4"></div>
    <div style="display:none" id="s5"></div>
    <div style="display:none" id="s6"></div>
  </div>

  <div id="results"></div>

</div>

<script>
const SPORTS = [
  {
    id: "football", emoji: "⚽",
    badge: "⚽ AI Powered · v3.8 PRO · Profesionální",
    title: "FOTBALOVÝ<br>ANALYTIK",

// ===================== NAME MATCHING HELPERS =====================
// Normalize team name: lowercase, strip dots, collapse spaces
function normName(s) {
  return s.toLowerCase().replace(/\./g, '').replace(/\s+/g, ' ').trim();
}
// Strict match: both normalized names must be identical
function namesMatch(a, b) {
  return normName(a) === normName(b);
}

// ===================== PARSER =====================
function parseTeam(raw) {
  const nameMatch = raw.match(/(?:Last matches:|Analyzovaný tým\/hráč:)\s*(.+)/i);
  const name = nameMatch ? nameMatch[1].trim() : "Tým";
  const matches = [];
  const lines = raw.split('\n');

  lines.forEach(line => {
    const m = line.match(/^(.+?)\s+vs\s+(.+?):\s*(\d+(?:\(\d+\))?)\s*[-–—\s]+\s*(\d+(?:\(\d+\))?)\s*[-–—]\s*(Výhra|Prohra|Remíza|Win|Loss|Draw)/i);
    if (!m) return;

    const teamA = m[1].trim();
    const teamB = m[2].trim();
    const score1Raw = m[3].trim();
    const score2Raw = m[4].trim();
    const score1 = parseInt(score1Raw);
    const score2 = parseInt(score2Raw);
    const resultRaw = m[5].trim().toLowerCase();

    let isHome = normName(teamA).includes(normName(name)) || normName(name).includes(normName(teamA));
    // More precise: prefer exact match first
    const exactHomeMatch = normName(teamA) === normName(name);
    const exactAwayMatch = normName(teamB) === normName(name);
    if (exactHomeMatch) isHome = true;
    else if (exactAwayMatch) isHome = false;
    else isHome = normName(teamA).includes(normName(name)) || normName(name).includes(normName(teamA));
    let gf = isHome ? score1 : score2;
    let ga = isHome ? score2 : score1;
    let gfRaw = isHome ? score1Raw : score2Raw;
    let gaRaw = isHome ? score2Raw : score1Raw;
    let opp = isHome ? teamB : teamA;

    let result;
    if (resultRaw === 'výhra' || resultRaw === 'win') result = 'W';
    else if (resultRaw === 'prohra' || resultRaw === 'loss') result = 'L';
    else result = 'D';

    let parsedParts = [];
    const lineWithoutDate = line.replace(/\(\s*\d{1,2}[\./-]\d{1,2}[\./-]\d{2,4}\s*\)/g, '');
    const partsContainer = lineWithoutDate.match(/\(\s*([0-9\s,.:\-\–\—]+)\s*\)/);
    if (partsContainer) {
      const rawPartsArray = partsContainer[1].split(/[,;]\s*/);
      rawPartsArray.forEach(part => {
        const scoreMatch = part.match(/(\d+)\s*[-–—:]\s*(\d+)/);
        if (scoreMatch) {
          const s1 = parseInt(scoreMatch[1]);
          const s2 = parseInt(scoreMatch[2]);
          parsedParts.push({ gf: isHome ? s1 : s2, ga: isHome ? s2 : s1 });
        }
      });
    }

    matches.push({ opp, gf, ga, gfRaw, gaRaw, home: isHome, result, raw: line.trim(), parts: parsedParts });
  });

  return { name, matches, rawData: raw };
}

// ===================== STATS =====================
function calcStats(team) {
  const m = team.matches;
  if (!m.length) return null;

  const wins = m.filter(x => x.result === 'W');
  const draws = m.filter(x => x.result === 'D');
  const losses = m.filter(x => x.result === 'L');
  const totalGF = m.reduce((s, x) => s + x.gf, 0);
  const totalGA = m.reduce((s, x) => s + x.ga, 0);
  const totalGoals = m.reduce((s, x) => s + x.gf + x.ga, 0);
  const avgGoals = totalGoals / m.length;
  const avgGF = totalGF / m.length;
  const avgGA = totalGA / m.length;

  const lossesWithGoal = losses.filter(x => x.gf > 0);
  const resilience = losses.length ? Math.round(lossesWithGoal.length / losses.length * 100) : 100;
  const closeLosses = losses.filter(x => Math.abs(x.gf - x.ga) <= 2);
  const closeLossRate = losses.length ? Math.round(closeLosses.length / losses.length * 100) : 100;
  const blowoutWins = wins.filter(x => Math.abs(x.gf - x.ga) >= 3);
  const blowoutRate = wins.length ? Math.round(blowoutWins.length / wins.length * 100) : 0;

  const homeMatches = m.filter(x => x.home);
  const awayMatches = m.filter(x => !x.home);
  const homeWinPct = homeMatches.length ? Math.round(homeMatches.filter(x => x.result === 'W').length / homeMatches.length * 100) : 0;
  const awayWinPct = awayMatches.length ? Math.round(awayMatches.filter(x => x.result === 'W').length / awayMatches.length * 100) : 0;

  const isOpen = avgGoals >= SPORTS[currentSportIndex].overUnderTarget;

  return {
    n: m.length, wins: wins.length, draws: draws.length, losses: losses.length,
    winPct: Math.round(wins.length / m.length * 100),
    totalGF, totalGA,
    avgGoals: avgGoals.toFixed(2), avgGF: avgGF.toFixed(2), avgGA: avgGA.toFixed(2),
    resilience, closeLossRate, blowoutRate,
    homeMatches: homeMatches.length, awayMatches: awayMatches.length,
    homeWinPct, awayWinPct,
    isOpen,
    schedDiff: avgGA.toFixed(2),
    allOpponents: m.map(x => x.opp),
  };
}

// ===================== H2H & COMMON OPPS =====================

function findH2H(teamA, teamB) {
  const nameA = teamA.name;
  const nameB = teamB.name;
  const h2h = [];
  // Find matches where teamA played against teamB (opp is teamB)
  teamA.matches.forEach(m => {
    if (namesMatch(m.opp, nameB))
      h2h.push({ team: teamA.name, result: m.result, gf: m.gf, ga: m.ga, gfRaw: m.gfRaw, gaRaw: m.gaRaw, opp: m.opp, home: m.home, raw: m.raw });
  });
  // Find matches where teamB played against teamA (opp is teamA)
  teamB.matches.forEach(m => {
    if (namesMatch(m.opp, nameA))
      h2h.push({ team: teamB.name, result: m.result, gf: m.gf, ga: m.ga, gfRaw: m.gfRaw, gaRaw: m.gaRaw, opp: m.opp, home: m.home, raw: m.raw });
  });
  return h2h;
}

function findCommonOpps(tA, tB) {
  const common = [];
  tA.matches.forEach(mA => {
    // Find exact match in tB's matches
    const mB = tB.matches.find(x => namesMatch(x.opp, mA.opp));
    if (mB) {
      common.push({
        opp: mA.opp,
        resultA: mA.result, gfA: mA.gf, gaA: mA.ga, gfARaw: mA.gfRaw, gaARaw: mA.gaRaw,
        resultB: mB.result, gfB: mB.gf, gaB: mB.ga, gfBRaw: mB.gfRaw, gaBRaw: mB.gaRaw
      });
    }
  });
  return common;
}

// ===================== DEEP ANALYTICS =====================
function deepAnalytics(team) {
  const m = team.matches;
  const n = m.length;
  if (!n) return {};

  const wins = m.filter(x => x.result === 'W');
  const draws = m.filter(x => x.result === 'D');
  const losses = m.filter(x => x.result === 'L');
  const totalGF = m.reduce((s,x)=>s+x.gf,0);
  const totalGA = m.reduce((s,x)=>s+x.ga,0);

  const home = m.filter(x=>x.home);
  const away = m.filter(x=>!x.home);
  const homeGF = home.reduce((s,x)=>s+x.gf,0);
  const homeGA = home.reduce((s,x)=>s+x.ga,0);
  const awayGF = away.reduce((s,x)=>s+x.gf,0);
  const awayGA = away.reduce((s,x)=>s+x.ga,0);
  const homeWins = home.filter(x=>x.result==='W').length;
  const homeDraws = home.filter(x=>x.result==='D').length;
  const homeLosses = home.filter(x=>x.result==='L').length;
  const awayWins = away.filter(x=>x.result==='W').length;
  const awayDraws = away.filter(x=>x.result==='D').length;
  const awayLosses = away.filter(x=>x.result==='L').length;

  const scored = m.filter(x=>x.gf>0).length;
  const conceded = m.filter(x=>x.ga>0).length;
  const cleanSheets = m.filter(x=>x.ga===0).length;
  const blanks = m.filter(x=>x.gf===0).length;
  const btts = m.filter(x=>x.gf>0&&x.ga>0).length;
  const oneSided = m.filter(x=>!(x.gf>0&&x.ga>0)&&(x.gf>0||x.ga>0)).length;
  const zeroZero = m.filter(x=>x.gf===0&&x.ga===0).length;
  const oneGoalGame = m.filter(x=>x.gf+x.ga===1).length;
  const twoGoalGame = m.filter(x=>x.gf+x.ga>=2).length;
  const lowScore = m.filter(x=>x.gf+x.ga<=1).length;
  const midScore = m.filter(x=>x.gf+x.ga>=2&&x.gf+x.ga<=3).length;
  const highScore = m.filter(x=>x.gf+x.ga>=4).length;

  const closeWins = wins.filter(x=>x.gf-x.ga===1).length;
  const closeLosses = losses.filter(x=>x.ga-x.gf===1).length;
  const bigWins = wins.filter(x=>x.gf-x.ga>=2).length;
  const bigLosses = losses.filter(x=>x.ga-x.gf>=2).length;
  const drawWithGoal = draws.filter(x=>x.gf>0).length;

  let curWStreak=0, maxWStreak=0, curLStreak=0, maxLStreak=0;
  let curNoWin=0, maxNoWin=0, curNoLoss=0, maxNoLoss=0;
  m.forEach(x=>{
    if(x.result==='W'){curWStreak++;maxWStreak=Math.max(maxWStreak,curWStreak);curNoLoss++;maxNoLoss=Math.max(maxNoLoss,curNoLoss);curLStreak=0;curNoWin=0;}
    else if(x.result==='L'){curLStreak++;maxLStreak=Math.max(maxLStreak,curLStreak);curNoWin++;maxNoWin=Math.max(maxNoWin,curNoWin);curWStreak=0;curNoLoss=0;}
    else{curWStreak=0;curLStreak=0;curNoWin++;curNoLoss++;maxNoWin=Math.max(maxNoWin,curNoWin);maxNoLoss=Math.max(maxNoLoss,curNoLoss);}
  });

  let bounceBack=0, collapse=0;
  for(let i=1;i<n;i++){
    if(m[i-1].result==='L'&&m[i].result==='W') bounceBack++;
    if(m[i-1].result==='W'&&m[i].result==='L') collapse++;
  }

  const last3 = m.slice(-Math.min(3,n));
  const last5 = m.slice(-Math.min(5,n));
  const first = m.slice(0, Math.min(3,n));
  const firstPts = first.reduce((s,x)=>s+(x.result==='W'?3:x.result==='D'?1:0),0);
  const lastPts = last3.reduce((s,x)=>s+(x.result==='W'?3:x.result==='D'?1:0),0);
  const trendDir = lastPts/last3.length > firstPts/first.length ? '📈 Lepší' : lastPts/last3.length < firstPts/first.length ? '📉 Horší' : '➡️ Stabilní';
  const last5Form = last5.map(x=>x.result==='W'?'✅':x.result==='D'?'🟡':'❌').join(' ');
  const last3Form = last3.map(x=>x.result==='W'?'✅':x.result==='D'?'🟡':'❌').join(' ');

  const half1 = m.slice(0,Math.floor(n/2));
  const half2 = m.slice(Math.floor(n/2));
  const gfTrend = half2.reduce((s,x)=>s+x.gf,0)/Math.max(1,half2.length) > half1.reduce((s,x)=>s+x.gf,0)/Math.max(1,half1.length) ? '📈' : '📉';
  const gaTrend = half2.reduce((s,x)=>s+x.ga,0)/Math.max(1,half2.length) > half1.reduce((s,x)=>s+x.ga,0)/Math.max(1,half1.length) ? '📈 (více inkasuje)' : '📉 (méně inkasuje)';

  const avgGF = totalGF/n;
  const stdGF = Math.sqrt(m.reduce((s,x)=>s+Math.pow(x.gf-avgGF,2),0)/n);
  const consistency = stdGF < 0.8 ? 'Velmi konzistentní' : stdGF < 1.5 ? 'Středně konzistentní' : 'Velmi variabilní';

  const resultMap = {};
  m.forEach(x=>{const k=`${x.gf}:${x.ga}`;resultMap[k]=(resultMap[k]||0)+1;});
  const mostCommon = Object.entries(resultMap).sort((a,b)=>b[1]-a[1])[0];

  const totalPts = wins.length*3+draws.length;
  const ppg = (totalPts/n).toFixed(2);
  const resilienceStr = losses.length ? `${m.filter(x=>x.result==='L'&&x.gf>0).length}/${losses.length}` : 'N/A';
  const lostBlank = m.filter(x=>x.result==='L'&&x.gf===0).length;
  const wonClean = m.filter(x=>x.result==='W'&&x.ga===0).length;

  return {
    n, wins:wins.length, draws:draws.length, losses:losses.length,
    totalGF, totalGA,
    avgGF: avgGF.toFixed(2), avgGA: (totalGA/n).toFixed(2),
    avgGoalsPerGame: ((totalGF+totalGA)/n).toFixed(2),
    home:home.length, away:away.length,
    homeGF, homeGA, awayGF, awayGA,
    homeWins, homeDraws, homeLosses,
    awayWins, awayDraws, awayLosses,
    homeGFavg: home.length?(homeGF/home.length).toFixed(2):'0',
    homeGAavg: home.length?(homeGA/home.length).toFixed(2):'0',
    awayGFavg: away.length?(awayGF/away.length).toFixed(2):'0',
    awayGAavg: away.length?(awayGA/away.length).toFixed(2):'0',
    scored, conceded, cleanSheets, blanks, btts, oneSided,
    zeroZero, oneGoalGame, twoGoalGame, lowScore, midScore, highScore,
    closeWins, closeLosses, bigWins, bigLosses, drawWithGoal,
    maxWStreak, maxLStreak, maxNoWin, maxNoLoss,
    bounceBack, collapse,
    last3Form, last5Form, trendDir,
    gfTrend, gaTrend, consistency,
    mostCommon: mostCommon ? `${mostCommon[0]} (${mostCommon[1]}×)` : '–',
    ppg, resilienceStr, lostBlank, wonClean,
    scoredPct: Math.round(scored/n*100),
    concededPct: Math.round(conceded/n*100),
    bttsRate: Math.round(btts/n*100),
    cleanSheetRate: Math.round(cleanSheets/n*100),
    blankRate: Math.round(blanks/n*100),
    stdGF: stdGF.toFixed(2),
    lastResult: m[n-1] ? `${m[n-1].gf}:${m[n-1].ga} (${m[n-1].result==='W'?'Výhra':m[n-1].result==='L'?'Prohra':'Remíza'})` : '–',
    prevResult: m[n-2] ? `${m[n-2].gf}:${m[n-2].ga} (${m[n-2].result==='W'?'Výhra':m[n-2].result==='L'?'Prohra':'Remíza'})` : '–',
    goalDiff: totalGF - totalGA,
    winPct: Math.round(wins.length/n*100),
    totalPts,
  };
}

// ===================== SCORING SYSTÉM (10 kategorií) =====================
function calcSectionScores(dA, dB, h2hMatches, commonOpps, tA, tB) {
  const breakdown = [];

  function compareSection(label, metricsA, metricsB) {
    let winsA = 0, winsB = 0;
    metricsA.forEach((mA, i) => {
      const mB = metricsB[i];
      const a = parseFloat(mA.value), b = parseFloat(mB.value);
      if (isNaN(a) || isNaN(b) || a === b) return;
      if (mA.higherIsBetter !== false) {
        if (a > b) winsA++; else winsB++;
      } else {
        if (a < b) winsA++; else winsB++;
      }
    });
    const winner = winsA > winsB ? 'A' : winsB > winsA ? 'B' : 'tie';
    breakdown.push({ label, winsA, winsB, winner });
  }

  // 1. ZÁKLADNÍ BILANCE
  compareSection('📊 ZÁKLADNÍ BILANCE', [
    { value: dA.winPct }, { value: dA.ppg }, { value: dA.wins }, { value: dA.totalPts }
  ], [
    { value: dB.winPct }, { value: dB.ppg }, { value: dB.wins }, { value: dB.totalPts }
  ]);

  // 2. GÓLY — ÚTOK
  compareSection('⚽ GÓLY — ÚTOK', [
    { value: dA.avgGF }, { value: dA.totalGF }, { value: dA.homeGFavg }, { value: dA.awayGFavg }
  ], [
    { value: dB.avgGF }, { value: dB.totalGF }, { value: dB.homeGFavg }, { value: dB.awayGFavg }
  ]);

  // 3. GÓLY — OBRANA
  compareSection('🛡️ GÓLY — OBRANA', [
    { value: dA.avgGA, higherIsBetter: false }, { value: dA.totalGA, higherIsBetter: false },
    { value: dA.homeGAavg, higherIsBetter: false }, { value: dA.awayGAavg, higherIsBetter: false }
  ], [
    { value: dB.avgGA, higherIsBetter: false }, { value: dB.totalGA, higherIsBetter: false },
    { value: dB.homeGAavg, higherIsBetter: false }, { value: dB.awayGAavg, higherIsBetter: false }
  ]);

  // 4. DOMÁCÍ / VENKOVNÍ
  compareSection('🏠 DOMÁCÍ / VENKOVNÍ', [
    { value: dA.homeWins }, { value: dA.awayWins },
    { value: dA.homeGF - dA.homeGA }, { value: dA.awayGF - dA.awayGA }
  ], [
    { value: dB.homeWins }, { value: dB.awayWins },
    { value: dB.homeGF - dB.homeGA }, { value: dB.awayGF - dB.awayGA }
  ]);

  // 5. FORMA A TRENDY
  const formScoreA = dA.last5Form.split('✅').length - 1;
  const formScoreB = dB.last5Form.split('✅').length - 1;
  compareSection('📈 FORMA A TRENDY', [
    { value: formScoreA }, { value: dA.bounceBack }, { value: parseFloat(dA.ppg) }
  ], [
    { value: formScoreB }, { value: dB.bounceBack }, { value: parseFloat(dB.ppg) }
  ]);

  // 6. SÉRIE
  compareSection('🔢 SÉRIE', [
    { value: dA.maxWStreak }, { value: dA.maxNoLoss },
    { value: dA.maxLStreak, higherIsBetter: false }, { value: dA.maxNoWin, higherIsBetter: false }
  ], [
    { value: dB.maxWStreak }, { value: dB.maxNoLoss },
    { value: dB.maxLStreak, higherIsBetter: false }, { value: dB.maxNoWin, higherIsBetter: false }
  ]);

  // 7. CHARAKTER ZÁPASŮ
  compareSection('🎯 CHARAKTER ZÁPASŮ', [
    { value: dA.cleanSheetRate }, { value: dA.scoredPct },
    { value: dA.bttsRate }, { value: dA.blankRate, higherIsBetter: false }
  ], [
    { value: dB.cleanSheetRate }, { value: dB.scoredPct },
    { value: dB.bttsRate }, { value: dB.blankRate, higherIsBetter: false }
  ]);

  // 8. VÝHRY A PROHRY — CHARAKTER
  compareSection('⚡ VÝHRY A PROHRY', [
    { value: dA.bigWins }, { value: dA.wonClean },
    { value: dA.goalDiff }, { value: dA.bigLosses, higherIsBetter: false }
  ], [
    { value: dB.bigWins }, { value: dB.wonClean },
    { value: dB.goalDiff }, { value: dB.bigLosses, higherIsBetter: false }
  ]);

  // 9. H2H
  const h2hA = h2hMatches.filter(m => m.team === tA.name && m.result === 'W').length;
  const h2hB = h2hMatches.filter(m => m.team === tB.name && m.result === 'W').length;
  breakdown.push({
    label: '🆚 VZÁJEMNÉ ZÁPASY (H2H)',
    winsA: h2hA, winsB: h2hB,
    winner: h2hMatches.length === 0 ? 'tie' : h2hA > h2hB ? 'A' : h2hB > h2hA ? 'B' : 'tie'
  });

  // 10. SPOLEČNÍ SOUPEŘI
  let csA = 0, csB = 0;
  commonOpps.forEach(c => {
    const aPts = c.resultA==='W'?3:c.resultA==='D'?1:0;
    const bPts = c.resultB==='W'?3:c.resultB==='D'?1:0;
    if (aPts > bPts) csA++; else if (bPts > aPts) csB++;
  });
  breakdown.push({
    label: '🤝 SPOLEČNÍ SOUPEŘI',
    winsA: csA, winsB: csB,
    winner: commonOpps.length === 0 ? 'tie' : csA > csB ? 'A' : csB > csA ? 'B' : 'tie'
  });

  const scoreA = breakdown.filter(b => b.winner === 'A').length;
  const scoreB = breakdown.filter(b => b.winner === 'B').length;

  return { scoreA, scoreB, breakdown };
}

// ===================== HISTORY =====================
const HISTORY_KEY = "multisport_analytik_history_v2";

function getHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch (e) { return []; }
}

function saveHistory(history) {
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history.slice(0, 15)));
}

function addToHistory(sportIndex, rawA, rawB, resultsHtml) {
  const tA = parseTeam(rawA);
  const tB = parseTeam(rawB);
  const history = getHistory();
  history.unshift({
    id: Date.now().toString(),
    sportIndex,
    timestamp: new Date().toLocaleString('cs-CZ'),
    teamAName: tA.name || "Tým A",
    teamBName: tB.name || "Tým B",
    rawA, rawB, resultsHtml
  });
  saveHistory(history);
  renderHistory();
}

function loadHistoryItem(id) {
  const item = getHistory().find(x => x.id === id);
  if (!item) return;
  currentSportIndex = item.sportIndex;
  updateSportUI();
  document.getElementById('teamA').value = item.rawA;
  document.getElementById('teamB').value = item.rawB;
  const results = document.getElementById('results');
  results.style.display = 'block';
  results.innerHTML = item.resultsHtml;
  results.scrollIntoView({ behavior: 'smooth' });
}

function deleteHistoryItem(id) {
  saveHistory(getHistory().filter(x => x.id !== id));
  renderHistory();
}

function clearAllHistory() {
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
}

let isHistoryCollapsed = false;
function toggleHistory() {
  isHistoryCollapsed = !isHistoryCollapsed;
  document.getElementById('historyContainer').style.display = isHistoryCollapsed ? 'none' : 'block';
  document.getElementById('historyTitle').innerHTML = `<span>00</span> HISTORIE ANALÝZ (KLIKNĚTE PRO ${isHistoryCollapsed ? 'ZOBRAZENÍ' : 'SKRYTÍ'})`;
  if (!isHistoryCollapsed) renderHistory();
}

window.onload = function() {
  updateSportUI();
  renderHistory();
};

// ===================== STEP ANIMATOR =====================
function setStep(n) {
  for (let i = 1; i <= 6; i++) {
    const el = document.getElementById('s' + i);
    if (!el) continue;
    el.classList.remove('active', 'done');
    if (i < n) el.classList.add('done');
    if (i === n) el.classList.add('active');
  }
}

// ===================== MAIN ANALYSIS =====================
async function startAnalysis() {
  const sport = SPORTS[currentSportIndex];
  const rawA = document.getElementById('teamA').value.trim();
  const rawB = document.getElementById('teamB').value.trim();
  const btn = document.getElementById('btnAnalyze');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');

  if (!rawA || !rawB) {
    results.style.display = 'block';
    results.innerHTML = `<div class="err-msg">❌ Vložte prosím data pro obě strany k analýze!</div>`;
    results.scrollIntoView({ behavior: 'smooth' });
    return;
  }

  btn.disabled = true;
  loading.style.display = 'block';
  results.style.display = 'none';
  results.innerHTML = '';

  try {
    setStep(1);
    await sleep(400);
    const tA = parseTeam(rawA);
    const tB = parseTeam(rawB);

    setStep(2);
    await sleep(300);
    const sA = calcStats(tA);
    const sB = calcStats(tB);

    if (!sA || !sB) {
      throw new Error("Nepodařilo se správně parsovat zápasy. Zkontrolujte formát dat (např. 'TeamA vs TeamB: 2-1 - Výhra')");
    }

    const showDraw = sport.id !== "tennis" && sport.id !== "volleyball" && sport.id !== "esport" && sport.id !== "darts";
    const mathScoreA = sA.winPct * 0.4 + sA.resilience * 0.15 + sA.homeWinPct * 0.2 + (100 - sA.closeLossRate) * 0.05 + sA.blowoutRate * 0.2;
    const mathScoreB = sB.winPct * 0.4 + sB.resilience * 0.15 + sB.awayWinPct * 0.2 + (100 - sB.closeLossRate) * 0.05 + sB.blowoutRate * 0.2;
    const mathTotal = mathScoreA + mathScoreB + (showDraw ? 15 : 0);
    const mathProbA = Math.round(mathScoreA / mathTotal * 100);
    const mathProbB = Math.round(mathScoreB / mathTotal * 100);
    const mathProbD = showDraw ? 100 - mathProbA - mathProbB : 0;

    const parsedPred = { probA: mathProbA, probB: mathProbB, probD: mathProbD };

    loading.style.display = 'none';
    results.style.display = 'block';

    const outputHtml = renderResults(tA, tB, sA, sB, parsedPred);
    results.innerHTML = outputHtml;
    results.scrollIntoView({ behavior: 'smooth' });

    addToHistory(currentSportIndex, rawA, rawB, outputHtml);

  } catch (err) {
    loading.style.display = 'none';
    results.style.display = 'block';
    results.innerHTML = `<div class="err-msg">❌ Došlo k chybě: ${err.message}</div>`;
  }

  btn.disabled = false;
}

function copyAllData() {
  const sport = SPORTS[currentSportIndex];
  const rawA = document.getElementById('teamA').value.trim();
  const rawB = document.getElementById('teamB').value.trim();
  const verdictCard = document.querySelector('.verdict-card');
  const scoringPanel = document.querySelector('.scoring-panel');
  const verdictText = verdictCard ? verdictCard.innerText : "";
  const scoringText = scoringPanel ? scoringPanel.innerText : "";

  const report = `=== ${sport.emoji} ${sport.title.replace('<br>', ' ')} ===\n\nSTRANA A:\n${rawA}\n\nSTRANA B:\n${rawB}\n\n=== VÝSLEDEK ANALÝZY ===\n${verdictText}\n\n=== SKÓRE ANALÝZY ===\n${scoringText}\n`;

  const textarea = document.createElement('textarea');
  textarea.value = report;
  textarea.style.position = 'fixed';
  textarea.style.left = '-9999px';
  document.body.appendChild(textarea);
  textarea.select();
  try {
    document.execCommand('copy');
    const msg = document.getElementById('copySuccessMsg');
    if (msg) { msg.style.display = 'block'; setTimeout(() => msg.style.display = 'none', 5000); }
  } catch (err) { console.error('Kopírování selhalo:', err); }
  document.body.removeChild(textarea);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function clearInputs() {
  document.getElementById('teamA').value = '';
  document.getElementById('teamB').value = '';
  document.getElementById('results').style.display = 'none';
  document.getElementById('results').innerHTML = '';
  document.getElementById('loading').style.display = 'none';
  for (let i = 1; i <= 6; i++) {
    const el = document.getElementById('s' + i);
    if (el) el.classList.remove('active', 'done');
  }
  document.getElementById('teamA').focus();
}
